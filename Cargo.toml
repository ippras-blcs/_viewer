[package]
name = "viewer"
version = "0.1.0"
authors = ["Kazakov Giorgi Vladimirovich", "Sidorov Roman Alexandrovich"]
edition = "2024"

[dependencies]
anyhow = "1.0.101"
arrow = "57.3.0"
bytes = "1.11.1"
chrono = { version = "0.4.41", features = ["serde"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
] }
egui = "0.33.3"
egui-phosphor = "0.11.0"
egui_dnd = "0.14.0"
egui_extras = "0.33.3"
egui_plot = "0.34.0"
egui_table = "0.6.0"
egui_tiles = "0.14.1"
futures = "0.3.31"
indexmap = "2.13.0"
itertools = "0.14.0"
nom = "8.0.0"
object_store = { version = "0.12.5", features = ["http", "serde"] }
parquet = { version = "57.3.0", features = ["arrow", "async", "object_store"] }
polars = { git = "https://github.com/pola-rs/polars", rev = "05f6f2d", default-features = false, features = [
    "bitwise",
    "csv",
    "dtype-datetime",
    "dtype-struct",
    "dtype-u16",
    "dynamic_group_by",
    "fmt_no_tty",
    "lazy",
    "parquet",
    "rolling_window",
    "round_series",
    "row_hash",
    "serde",
    "temporal",
] }
polars-utils = { version = "0.52.0", features = ["nightly"] }
ron = "0.12.0"
rust_xlsxwriter = { version = "0.93.0", features = ["chrono", "wasm"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
unic-langid = { version = "0.9.6", features = ["macros"] }
urlencoding = "2.1.3"

egui_ext = { git = "https://github.com/kgv/egui_ext" }
egui_l20n = { git = "https://github.com/kgv/egui_l20n", features = ["macros"] }
egui_tiles_ext = { git = "https://github.com/kgv/egui_tiles_ext" }
metadata = { git = "https://github.com/ippras/metadata", branch = "semicolon" }

# native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
poll-promise = { version = "0.3.0", features = ["tokio"] }
rumqttc = "0.25.1"
tokio = { version = "1.49.0", features = ["full"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# web
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22.1"
console_error_panic_hook = "0.1.7"
ewebsock = "0.8.0"
js-sys = "0.3.85"
poll-promise = { version = "0.3.0", features = ["web"] }
tokio = { version = "1.49.0", features = ["macros", "rt", "sync", "time"] }
tokio_with_wasm = { version = "0.9.0", features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
web-sys = { version = "0.3.85", features = ["Blob", "BlobPropertyBag", "Url"] }
# rumqttc = { version = "0.24.0", features = ["websocket"] }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
